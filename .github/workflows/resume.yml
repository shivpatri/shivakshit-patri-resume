name: Build and Deploy Resume

on:
  push:
    branches:
      - main # Change to 'master' if that is your repository's default branch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX resume
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex # ⚠️ Change this to your Overleaf .tex filename

      - name: Prepare publish directory
        run: |
          mkdir publish
          cp resume.pdf publish/resume.pdf # ⚠️ Change main.pdf to match your compiled filename

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          force_orphan: true # Keeps your repository small by not saving PDF history
